<aside class="sidebar">
  <a class="brand sidebar-brand-logo" href="{{ url_for('main.dashboard') }}">
    <img
      src="{{ url_for('static', filename='img/identidade-camarao.jpg') }}"
      alt="Estoque de Camarões"
      class="sidebar-logo"
    >
  </a>

  <div class="sidebar-establishment">
    <span>ESTABELECIMENTO</span>
    <strong>{{ current_user.establishment.name }}</strong>
  </div>

  <nav class="nav flex-column" aria-label="Navegação principal">
    <a
      class="nav-link {{ 'active' if request.endpoint == 'main.dashboard' }}"
      href="{{ url_for('main.dashboard') }}"
    >
      <span aria-hidden="true">▦</span>
      Painel
    </a>

    <a
      class="nav-link {{ 'active' if request.endpoint == 'inventory.stock_list' }}"
      href="{{ url_for('inventory.stock_list') }}"
    >
      <span aria-hidden="true">▤</span>
      Estoque
    </a>

    <a
      class="nav-link {{ 'active' if request.endpoint == 'inventory.chambers' }}"
      href="{{ url_for('inventory.chambers') }}"
    >
      <span aria-hidden="true">▥</span>
      Câmaras
    </a>

    <a
      class="nav-link {{ 'active' if request.endpoint == 'main.preferences' }}"
      href="{{ url_for('main.preferences') }}"
    >
      <span aria-hidden="true">⚙</span>
      Preferências
    </a>
  </nav>

  <div class="sidebar-bottom">
    <span class="user-avatar">{{ current_user.name[:1]|upper }}</span>
    <span class="user-name">{{ current_user.name }}</span>

    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="logout-button" type="submit" aria-label="Sair">
        Sair
      </button>
    </form>
  </div>
</aside>
