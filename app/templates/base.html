<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Estoque de Camarões{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body data-theme="{{ current_user.preferences.theme if current_user.is_authenticated and current_user.preferences else 'CLARO' }}" data-accent="{{ current_user.preferences.accent_color if current_user.is_authenticated and current_user.preferences else 'AZUL' }}">
  {% block body %}{% endblock %}
</body>
</html>
